<!DOCTYPE html>
<html>
<head>
    <title>Test Settings Storage</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        #status { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Chrome Extension Settings Test</h1>
        <p><strong>Note:</strong> This page must be opened as part of the Chrome extension to work properly.</p>
        
        <div class="form-group">
            <label>API Key:</label>
            <input type="text" id="apiKey" placeholder="Enter your OpenAI API key">
        </div>
        
        <div class="form-group">
            <label>Model:</label>
            <select id="model">
                <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                <option value="gpt-4">GPT-4</option>
                <option value="gpt-4-turbo">GPT-4 Turbo</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Temperature: <span id="tempValue">0.7</span></label>
            <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7">
        </div>
        
        <div class="form-group">
            <button id="saveBtn" class="btn-primary">💾 Save Settings</button>
            <button id="loadBtn" class="btn-secondary">📥 Load Settings</button>
            <button id="clearBtn" class="btn-danger">🗑️ Clear All Settings</button>
        </div>
        
        <div id="status"></div>
        
        <div id="debug" style="margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 4px; font-family: monospace; font-size: 12px;">
            <strong>Debug Info:</strong><br>
            <span id="chromeStatus">Checking Chrome API...</span>
        </div>
    </div>
    
    <script>
        const apiKeyInput = document.getElementById('apiKey');
        const modelSelect = document.getElementById('model');
        const temperatureInput = document.getElementById('temperature');
        const tempValue = document.getElementById('tempValue');
        const saveBtn = document.getElementById('saveBtn');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const status = document.getElementById('status');
        const chromeStatus = document.getElementById('chromeStatus');
        
        // Check if Chrome APIs are available
        function checkChromeAPI() {
            console.log('Checking Chrome API...');
            console.log('typeof chrome:', typeof chrome);
            console.log('chrome object:', chrome);
            
            if (typeof chrome !== 'undefined' && chrome && chrome.storage && chrome.storage.sync) {
                chromeStatus.innerHTML = '✅ Chrome storage API is available';
                chromeStatus.style.color = 'green';
                console.log('Chrome API is available');
                return true;
            } else {
                chromeStatus.innerHTML = '❌ Chrome storage API is NOT available. This page must be opened as part of the extension.';
                chromeStatus.style.color = 'red';
                console.log('Chrome API is NOT available');
                return false;
            }
        }
        
        // Update temperature display
        temperatureInput.addEventListener('input', (e) => {
            tempValue.textContent = e.target.value;
        });
        
        // Show status message
        function showStatus(message, type) {
            status.innerHTML = `<div class="${type}">${message}</div>`;
        }
        
        // Save settings
        saveBtn.addEventListener('click', async () => {
            if (!checkChromeAPI()) {
                showStatus('❌ Cannot save settings: Chrome API not available. Please open this page through the extension.', 'error');
                return;
            }
            
            try {
                const settings = {
                    apiKey: apiKeyInput.value.trim(),
                    model: modelSelect.value,
                    temperature: parseFloat(temperatureInput.value),
                    autoSummarize: false
                };
                
                console.log('Saving settings:', settings);
                
                await chrome.storage.sync.set({ aiAssistantSettings: settings });
                
                showStatus('✅ Settings saved successfully!', 'success');
                console.log('Settings saved to Chrome storage');
                
            } catch (error) {
                console.error('Error saving settings:', error);
                showStatus(`❌ Error saving settings: ${error.message}`, 'error');
            }
        });
        
        // Load settings
        loadBtn.addEventListener('click', async () => {
            if (!checkChromeAPI()) {
                showStatus('❌ Cannot load settings: Chrome API not available. Please open this page through the extension.', 'error');
                return;
            }
            
            try {
                const result = await chrome.storage.sync.get(['aiAssistantSettings']);
                const settings = result.aiAssistantSettings || {};
                
                console.log('Loaded settings:', settings);
                
                apiKeyInput.value = settings.apiKey || '';
                modelSelect.value = settings.model || 'gpt-3.5-turbo';
                temperatureInput.value = settings.temperature || 0.7;
                tempValue.textContent = settings.temperature || 0.7;
                
                showStatus('📥 Settings loaded successfully!', 'info');
                
            } catch (error) {
                console.error('Error loading settings:', error);
                showStatus(`❌ Error loading settings: ${error.message}`, 'error');
            }
        });
        
        // Clear settings
        clearBtn.addEventListener('click', async () => {
            if (!checkChromeAPI()) {
                showStatus('❌ Cannot clear settings: Chrome API not available. Please open this page through the extension.', 'error');
                return;
            }
            
            try {
                await chrome.storage.sync.clear();
                showStatus('🗑️ All settings cleared!', 'info');
                console.log('Settings cleared');
                
                // Clear form
                apiKeyInput.value = '';
                modelSelect.value = 'gpt-3.5-turbo';
                temperatureInput.value = 0.7;
                tempValue.textContent = '0.7';
                
            } catch (error) {
                console.error('Error clearing settings:', error);
                showStatus(`❌ Error clearing settings: ${error.message}`, 'error');
            }
        });
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing...');
            
            // Check Chrome API with a small delay to ensure it's loaded
            setTimeout(() => {
                const apiAvailable = checkChromeAPI();
                if (apiAvailable) {
                    loadBtn.click(); // Auto-load settings on page load
                } else {
                    // Try again after a longer delay
                    setTimeout(() => {
                        const apiAvailable2 = checkChromeAPI();
                        if (apiAvailable2) {
                            loadBtn.click();
                        }
                    }, 1000);
                }
            }, 100);
        });
    </script>
</body>
</html>
