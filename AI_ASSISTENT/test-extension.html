<!DOCTYPE html>
<html>
<head>
    <title>Test Extension Communication</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Extension Communication Test</h1>
        <p>This page tests if the extension can communicate with the background script.</p>
        
        <button onclick="testBackgroundCommunication()">Test Background Communication</button>
        <button onclick="testAIService()">Test AI Service</button>
        <button onclick="testSettings()">Test Settings</button>
        
        <div id="result" class="result" style="display: none;"></div>
    </div>
    
    <script>
        function showResult(message, type = 'info') {
            const result = document.getElementById('result');
            result.textContent = message;
            result.className = `result ${type}`;
            result.style.display = 'block';
        }
        
        async function testBackgroundCommunication() {
            try {
                showResult('Testing background communication...', 'info');
                
                const response = await chrome.runtime.sendMessage({
                    action: 'getPageContent'
                });
                
                if (response.success) {
                    showResult('✅ Background communication working!', 'success');
                } else {
                    showResult(`❌ Error: ${response.error}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Communication failed: ${error.message}`, 'error');
            }
        }
        
        async function testAIService() {
            try {
                showResult('Testing AI service...', 'info');
                
                const response = await chrome.runtime.sendMessage({
                    action: 'callAIService',
                    data: {
                        message: 'Hello, this is a test message.',
                        context: { title: 'Test Page', url: window.location.href },
                        settings: {
                                apiKey: '', // REMOVED: OpenAI API key for security
                            model: 'gpt-3.5-turbo',
                            temperature: 0.7
                        }
                    }
                });
                
                if (response.success) {
                    showResult(`✅ AI Service working! Response: ${response.response}`, 'success');
                } else {
                    showResult(`❌ AI Service error: ${response.error}`, 'error');
                }
            } catch (error) {
                showResult(`❌ AI Service failed: ${error.message}`, 'error');
            }
        }
        
        async function testSettings() {
            try {
                showResult('Testing settings...', 'info');
                
                const response = await chrome.runtime.sendMessage({
                    action: 'getSettings'
                });
                
                if (response.success) {
                    showResult(`✅ Settings working! API Key: ${response.settings.apiKey ? 'Set' : 'Not set'}`, 'success');
                } else {
                    showResult(`❌ Settings error: ${response.error}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Settings failed: ${error.message}`, 'error');
            }
        }
        
        // Check if we're in extension context
        if (typeof chrome === 'undefined' || !chrome.runtime) {
            showResult('❌ This page must be opened as part of the Chrome extension to work.', 'error');
        } else {
            showResult('✅ Extension context detected. Ready to test!', 'success');
        }
    </script>
</body>
</html>
