<!DOCTYPE html>
<html>
<head>
    <title>Simple Gemini Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 Simple Gemini API Test</h1>
    <p>This will test your Gemini API key directly.</p>
    
    <button onclick="testGemini()">Test Gemini API</button>
    <div id="result" class="result info" style="display: none;"></div>
    
    <script>
        const API_KEY = 'AIzaSyCyCAN1aMOALrm-rw4TqIMiGeSEOY07wnI';
        
        function showResult(message, type) {
            const result = document.getElementById('result');
            result.textContent = message;
            result.className = `result ${type}`;
            result.style.display = 'block';
        }
        
        async function testGemini() {
            showResult('Testing Gemini API...', 'info');
            
            try {
                console.log('Testing Gemini API with key:', API_KEY.substring(0, 10) + '...');
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: 'Hello, how are you?'
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 100
                        }
                    })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Full response:', data);
                    
                    if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                        const text = data.candidates[0].content.parts[0].text;
                        showResult(`✅ SUCCESS! Gemini responded: "${text}"`, 'success');
                    } else {
                        console.log('Unexpected response format:', data);
                        showResult(`❌ Unexpected response format: ${JSON.stringify(data)}`, 'error');
                    }
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    console.log('Error response:', errorData);
                    showResult(`❌ API Error ${response.status}: ${errorData.error?.message || response.statusText}`, 'error');
                }
            } catch (error) {
                console.error('Network error:', error);
                showResult(`❌ Network Error: ${error.message}`, 'error');
            }
        }
        
        // Auto-run test on page load
        document.addEventListener('DOMContentLoaded', () => {
            testGemini();
        });
    </script>
</body>
</html>
